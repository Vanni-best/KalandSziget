 function save(){try{localStorage.setItem(STORAGE,JSON.stringify(progress))}catch(e){}}
 function updateTop(){$('starCounter').textContent='⭐ '+progress.stars;$('soundToggle').textContent=progress.sound?'🔊':'🔇';$('soundToggle').setAttribute('aria-pressed',String(progress.sound))}
 function getVoices(){if(!('speechSynthesis' in window))return [];voices=window.speechSynthesis.getVoices().filter(v=>/^hu([-_]|$)/i.test(v.lang));return voices}
 function speak(text,force=false){if((!progress.sound&&!force)||!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='hu-HU';u.rate=.83;u.pitch=1.12;u.volume=1;const avail=getVoices();u.voice=avail.find(v=>v.voiceURI===progress.voiceURI)||avail.find(v=>v.localService)||avail[0]||null;window.speechSynthesis.speak(u)}catch(e){console.warn('Beszéd nem elérhető:',e)}}
 if('speechSynthesis' in window){getVoices();window.speechSynthesis.onvoiceschanged=()=>{getVoices();if(!$('parentModal').hidden)renderParents()}}
 function stopSpeech(){if('speechSynthesis' in window)try{window.speechSynthesis.cancel()}catch(e){}}
 function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
 const card=(id,g)=>`<button class="game-card ${g.cls}" data-start="${id}" aria-label="${g.name} játék indítása"><span class="card-arrow" aria-hidden="true">➜</span><span class="card-icon" aria-hidden="true">${g.emoji}</span><span><span class="card-title">${g.name}</span><span class="card-desc" style="display:block">${g.desc}</span><span class="card-progress" style="display:inline-block">⭐ ${progress.solved[id]} feladat</span></span></button>`;
 function menu(){stopSpeech();current=null;updateTop();$('screen').innerHTML=`<section class="hero"><div><span class="eyebrow">🌈 JÁTÉKOS TANULÁS · 6 ÉVESEKNEK</span><h1>Indulhat a<br/><span>kaland?</span></h1><p>Szia! Rudi vagyok. Gyere, számoljunk, játsszunk és tanuljunk együtt!</p><button id="startFirst" class="primary">▶ Kezdjük el!</button></div><div class="hero-art"><div class="halo"></div><span class="hero-star">⭐</span>${foxSvg}<div class="speech-bubble">Szia! 👋</div></div></section><div class="section-top"><div><h2>Válassz egy kalandot! 🗺️</h2><p>Koppints egy színes szigetre!</p></div></div><section class="game-grid">${Object.entries(GAMES).map(([id,g])=>card(id,g)).join('')}<button class="game-card card-stickers" id="stickersOpen" aria-label="Matricaalbum megnyitása"><span class="card-arrow" aria-hidden="true">➜</span><span class="card-icon" aria-hidden="true">🎁</span><span><span class="card-title">Matricaalbum</span><span class="card-desc" style="display:block">Nézd meg a jutalmaid!</span><span class="card-progress" style="display:inline-block">${STICKERS.filter(s=>progress.stars>=s.at).length} / ${STICKERS.length} matrica</span></span></button></section><p class="bottom-tip">🔊 Érintsd meg a hangszórót! Rudi mindent elmond magyarul.</p>`;document.querySelectorAll('[data-start]').forEach(x=>x.addEventListener('click',()=>start(x.dataset.start)));$('startFirst').onclick=()=>start('count');$('stickersOpen').onclick=stickers}
 function start(id){stopSpeech();current=id;round=0;answerState='none';lastWord=null;lastLetter=null;nextQuestion(true)}
 function maxRounds(){return current==='letters'?10:current==='treasure'?6:8}
 function nextQuestion(withSpeech=true){clearTimeout(pendingTimer);round++;answerState='none';wrongGuesses=0;selected=[];if(round>maxRounds()){endRound();return}const kind=current==='treasure'?['count','math','letters','words','count','math'][round-1]:current;if(kind==='letters'&&current==='letters'&&round%2===1){letterFocus=pickLetter();question={kind:'letterLesson',letter:letterFocus};}else if(kind==='letters')question={kind:'letters',letter:current==='letters'?letterFocus:pickLetter()};else if(kind==='count')question=makeCount();else if(kind==='math')question=makeMath();else if(kind==='words')question=makeWord();renderQuestion();if(withSpeech)speak(questionSpeech())}
 function pickLetter(){const learned=progress.solved.letters;const available=learned<8?[0,1,2,3,14,15,18,20,21,22]:learned<24?LETTERS.slice(0,18).map((_,i)=>i):LETTERS.map((_,i)=>i);let item=choose(available.map(i=>LETTERS[i]));if(lastLetter===item[0]&&available.length>1)item=choose(available.map(i=>LETTERS[i]).filter(x=>x[0]!==lastLetter));lastLetter=item[0];return item}
 function makeCount(){const solved=progress.solved.count+progress.solved.treasure;const ceiling=solved<12?5:solved<35?10:20;const n=rand(1,ceiling);const emoji=choose(['🍎','🍓','🐥','🐠','🦋','🌼','🍪']);return {kind:'count',n,emoji,options:numericOptions(n,ceiling)}}
 function makeMath(){const solved=progress.solved.math+progress.solved.treasure;const max=solved<14?5:10;const minus=solved>=5&&Math.random()<.35;let a,b,n;if(minus){a=rand(2,max);b=rand(1,a);n=a-b}else{a=rand(1,max-1);b=rand(1,max-a);n=a+b}return {kind:'math',a,b,n,minus,emoji:choose(['🍓','🍎','⭐','🐝','🍬']),options:numericOptions(n,max)}}
 function numericOptions(n,max){const opts=new Set([n]);const candidates=shuffle([...Array(max+1).keys()].filter(x=>x!==n).sort((a,b)=>Math.abs(a-n)-Math.abs(b-n)).slice(0,7));while(opts.size<3){let v=candidates.pop();if(v===undefined)v=rand(0,Math.max(5,max));if(v!==n)opts.add(v)}return shuffle([...opts])}
 function makeWord(){const s=progress.solved.words+progress.solved.treasure;let pool=WORDS.slice(0,s<8?6:s<25?11:WORDS.length);let word=choose(pool);if(pool.length>1&&word[0]===lastWord)word=choose(pool.filter(x=>x[0]!==lastWord));lastWord=word[0];const letters=word[0].split('');const distractors='AEIOUÁÉÖŐÜŰMNTKPSLRHD';let extra=choose(distractors.split('').filter(x=>!letters.includes(x)));return {kind:'words',word:word[0],emoji:word[1],spoken:word[2],tiles:shuffle([...letters,extra].map((letter,i)=>({letter,id:i})))}}
 function questionSpeech(){if(!question)return '';switch(question.kind){case 'count':return 'Hány '+(question.emoji==='🍎'?'alma':question.emoji==='🍓'?'eper':question.emoji==='🐥'?'csibe':question.emoji==='🐠'?'halacska':question.emoji==='🦋'?'pillangó':question.emoji==='🌼'?'virág':'süti')+' van a képen? Számold meg őket, és válaszd ki a számot!';case 'math':return 'Mennyi '+question.a+(question.minus?' mínusz ':' meg ')+question.b+'? Számold meg!';case 'letterLesson':return 'Ismerkedjünk a betűkkel! Ez a '+question.letter[0]+' betű. '+question.letter[0]+', mint '+question.letter[1]+'. Hallgasd meg, és jegyezd meg!';case 'letters':return 'Keresd meg a '+question.letter[0]+' betűt! '+question.letter[0]+', mint '+question.letter[1]+'. Koppints a megfelelő betűre!';case 'words':return 'Rakd ki a szót! A képen: '+question.spoken+'. '+question.spoken+'. Koppints egymás után a betűkre!';default:return ''}}
 const speaker=()=>`<button class="audio-button" id="repeatAudio" aria-label="Feladat meghallgatása"><span class="megaphone">🔊</span> Hallgasd meg!</button>`;
 function objectHtml(emoji,count,subtract=0){return [...Array(count)].map((_,i)=>`<span class="object ${i>=count-subtract?'cancelled':''}" style="animation-delay:${Math.min(i*.04,.5)}s" aria-hidden="true">${emoji}</span>`).join('')}
 function numberChoices(){return `<div class="answer-grid">${question.options.map(n=>`<button class="choice" data-number="${n}" aria-label="${n}">${n}</button>`).join('')}</div>`}
 function letterChoices(){let options=[question.letter[0]];const others=shuffle(LETTERS.map(x=>x[0]).filter(x=>x!==question.letter[0]));options.push(...others.slice(0,2));return `<div class="answer-grid">${shuffle(options).map(x=>`<button class="choice" data-letter="${x}" aria-label="${x} betű">${x}</button>`).join('')}</div>`}
 function wordChoices(){return `<div class="big-photo" role="img" aria-label="${question.spoken}">${question.emoji}</div><div class="slots">${question.word.split('').map((_,i)=>`<div class="slot" id="slot${i}"> </div>`).join('')}</div><div class="letter-tray">${question.tiles.map(t=>`<button class="tile" data-tile="${t.id}" aria-label="${t.letter} betű">${t.letter}</button>`).join('')}</div><div class="small-controls"><button class="secondary" id="spellWord">🔊 Betűk meghallgatása</button><button class="secondary" id="undoLetter">↶ Vissza</button><button class="secondary" id="clearWord">🔄 Újra</button></div>`}
 function renderQuestion(){const k=question.kind;let title=k==='count'?'Hány darabot látsz?':k==='math'?'Számoljunk együtt!':k==='letterLesson'?'Ismerkedj a betűvel!':k==='letters'?'Melyik betűt hallod?':'Rakd ki a szót!';let visual='';if(k==='count')visual=`<div class="objects">${objectHtml(question.emoji,question.n)}</div>${numberChoices()}`;else if(k==='math')visual=`<div class="objects">${objectHtml(question.emoji,question.minus?question.a:question.a+question.b,question.minus?question.b:0)}</div><div style="font-size:clamp(33px,7vw,55px);font-weight:1000;margin:-10px 0 12px" aria-label="${question.a} ${question.minus?'mínusz':'plusz'} ${question.b}">${question.a} ${question.minus?'−':'+'} ${question.b} = ?</div>${numberChoices()}`;else if(k==='letterLesson')visual=`<div class="intro-scene"><div class="large-letter">${question.letter[0]}</div><div class="object">${question.letter[2]}</div><div class="sample-word">${question.letter[1]}</div></div><button class="primary purple next-btn" id="learnNext">Értem! ➜</button>`;else if(k==='letters')visual=letterChoices();else if(k==='words')visual=wordChoices();const g=GAMES[current];$('screen').innerHTML=`<section class="game-shell"><div class="game-head"><button class="back" id="goBack">← Vissza</button><span class="level-chip">${g.emoji} ${g.name} · ${round}/${maxRounds()}</span></div><div class="progress" aria-label="Kaland előrehaladása"><div style="width:${(round-1)/maxRounds()*100}%"></div></div><section class="play-panel"><span class="task-label">✨ ${current==='treasure'?'Kincsküldetés':'Rudi feladata'}</span><h1 class="task-title">${title}</h1>${k==='letters'?'<p class="task-sub">Figyelj Rudi hangjára! 👂</p>':''}${speaker()}${visual}<div class="feedback" id="feedback" aria-live="polite"></div><div id="nextHolder"></div></section></section>`;
 $('goBack').onclick=menu;$('repeatAudio').onclick=()=>speak(questionSpeech(),true);if(k==='letterLesson')$('learnNext').onclick=()=>nextQuestion();if(k==='count'||k==='math')document.querySelectorAll('[data-number]').forEach(btn=>btn.onclick=()=>answerChoice(Number(btn.dataset.number),btn));if(k==='letters')document.querySelectorAll('[data-letter]').forEach(btn=>btn.onclick=()=>answerChoice(btn.dataset.letter,btn));if(k==='words'){document.querySelectorAll('[data-tile]').forEach(btn=>btn.onclick=()=>pickTile(Number(btn.dataset.tile)));$('spellWord').onclick=()=>speak('Figyelj! '+question.word.split('').join('. ')+'. Most te jössz!',true);$('undoLetter').onclick=undoLetter;$('clearWord').onclick=clearWord}}
 function feedback(msg,good){let el=$('feedback');if(el){el.className='feedback '+(good?'success':'retry');el.textContent=msg}}
 function markSolved(){if(answerState==='correct')return;answerState='correct';const gain=current==='treasure'?3:2;progress.stars+=gain;progress.solved[current]++;save();updateTop();feedback('🌟 Ügyes vagy! +'+gain+' csillag',true);speak('Ügyes vagy! Nagyon szép munka!');$('nextHolder').innerHTML=`<button class="primary green next-btn" id="nextQuestion">Tovább! ➜</button>`;$('nextQuestion').onclick=()=>nextQuestion();let openSticker=STICKERS.find(s=>progress.stars>=s.at&&progress.stars-gain<s.at);if(openSticker)showToast('🎁 Új matrica: '+openSticker.name+'!')}
 function answerChoice(value,btn){if(answerState==='correct')return;const correct=question.kind==='letters'?question.letter[0]:question.n;if(value===correct){btn.classList.add('correct');document.querySelectorAll('.choice').forEach(x=>x.disabled=true);markSolved()}else{wrongGuesses++;btn.classList.add('wrong');feedback('💛 Próbáld újra!',false);speak('Próbáld újra! Menni fog!');setTimeout(()=>{btn.classList.remove('wrong');if(wrongGuesses>=2){const key=question.kind==='letters'?'letter':'number';document.querySelectorAll('.choice').forEach(x=>{if(String(x.dataset[key])===String(correct))x.classList.add('hint-ring')})}},470)}}
 function updateSlots(){question.word.split('').forEach((_,i)=>{let el=$('slot'+i);if(el){el.textContent=selected[i]?.letter||'';el.classList.toggle('filled',Boolean(selected[i]))}});document.querySelectorAll('[data-tile]').forEach(btn=>btn.classList.toggle('used',selected.some(t=>t.id===Number(btn.dataset.tile))))}
 function pickTile(id){if(answerState==='correct'||selected.some(t=>t.id===id)||selected.length>=question.word.length)return;const tile=question.tiles.find(t=>t.id===id);selected.push(tile);updateSlots();speak(tile.letter);if(selected.length===question.word.length){if(selected.map(x=>x.letter).join('')===question.word){markSolved()}else{wrongGuesses++;feedback('💛 Próbáld újra!',false);speak('Majdnem! Próbáld újra!');clearTimeout(pendingTimer);pendingTimer=setTimeout(()=>{if(question?.kind==='words'&&answerState!=='correct'){selected=[];updateSlots()}},1100)}}}
 function undoLetter(){if(answerState==='correct')return;selected.pop();updateSlots();feedback('',false)}function clearWord(){if(answerState==='correct')return;selected=[];updateSlots();feedback('',false)}
 function endRound(){const id=current;progress.completed[id]++;const reward=id==='treasure'?7:5;progress.stars+=reward;save();updateTop();$('screen').innerHTML=`<section class="game-shell"><div class="play-panel" style="padding-top:45px"><span class="trophy">${id==='treasure'?'🏆':'🎉'}</span><h1 class="win-title">Fantasztikus vagy!</h1><p class="win-sub">Sikerült a kaland! Rudi büszke rád!</p><div class="win-stars">⭐ ⭐ ⭐</div><p class="win-sub" style="margin-top:20px">+${reward} bónuszcsillag!</p><button class="primary green next-btn" id="more">🔁 Játsszunk még!</button><button class="secondary" id="backHome" style="margin-top:13px;min-width:220px">🏝️ Vissza a szigetre</button></div></section>`;$('more').onclick=()=>start(id);$('backHome').onclick=menu;speak('Hurrá! Fantasztikus vagy! Megcsináltad! Kaptál még '+reward+' csillagot!')}
 function stickers(){stopSpeech();current=null;$('screen').innerHTML=`<section class="game-shell"><div class="game-head"><button class="back" id="albumBack">← Vissza</button><span class="level-chip">🎁 ${progress.stars} csillagod van!</span></div><div class="play-panel"><h1 class="task-title">A te matricaalbumod! 🌈</h1><p class="task-sub">Gyűjts csillagokat és szerezz ajándékokat!</p><button class="audio-button" id="albumSpeech">🔊 Hallgasd meg!</button><div class="rewards">${STICKERS.map(s=>`<div class="sticker ${progress.stars<s.at?'locked':''}"><div class="sticker-icon">${progress.stars>=s.at?s.icon:'🔒'}</div><div class="sticker-caption">${progress.stars>=s.at?s.name:s.at+' ⭐ kell hozzá'}</div></div>`).join('')}</div><button class="primary next-btn" id="albumHome">🏝️ Játékok</button></div></section>`;$('albumBack').onclick=menu;$('albumHome').onclick=menu;$('albumSpeech').onclick=()=>speak('Ez a te matricaalbumod! Játssz sokat, és gyűjts új ajándékokat!',true);speak('Nézd meg a matricáidat!')}
 function renderParents(){const t=$('parentModal');const hadFocus=document.activeElement;t.hidden=false;const support='speechSynthesis' in window;const options=getVoices();const voiceOptions=options.length?options.map(v=>`<option value="${v.voiceURI.replaceAll('"','&quot;')}" ${v.voiceURI===progress.voiceURI?'selected':''}>${v.name.replaceAll('<','&lt;')} (${v.lang})</option>`).join(''):'<option value="">Automatikus magyar hang</option>';t.innerHTML=`<section class="parent-box" role="dialog" aria-modal="true" aria-label="Szülői beállítások"><div style="display:flex;justify-content:space-between;align-items:center"><h2>👨‍👩‍👧 Szülőknek</h2><button class="icon-btn" id="closeParent" aria-label="Bezárás">✕</button></div><p>A játék az eszköz magyar beszédhangját használja. A 🔊 gombbal bármikor megismételhető egy feladat. Az adatokat csak ezen a készüléken tároljuk.</p><div class="stat-list"><div class="stat"><b>${progress.stars}</b>Csillag</div><div class="stat"><b>${Object.values(progress.solved).reduce((a,b)=>a+b,0)}</b>Feladat</div><div class="stat"><b>${Object.values(progress.completed).reduce((a,b)=>a+b,0)}</b>Kaland</div></div><div class="setting-row"><label for="soundSetting">🔊 Hang bekapcsolva</label><input type="checkbox" id="soundSetting" ${progress.sound?'checked':''} style="width:24px;height:24px" /></div><div class="setting-row"><label for="voiceSelect">🇭🇺 Magyar hang</label><select id="voiceSelect">${voiceOptions}</select></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="parent-button" id="testVoice">🔊 Hang tesztelése</button><button class="parent-button danger" id="resetProgress">Haladás törlése</button></div><p id="voiceHelp">${support?options.length?'Magyar beszédhang elérhető ezen az eszközön.':'Nem találtunk külön magyar hangot a listában. A böngésző megpróbál magyarul felolvasni; ha rossz a kiejtés, telepíts magyar rendszerszintű beszédhangot.':'Ez a böngésző nem támogatja a beszédfelolvasást. Próbáld a Safarit vagy a Chrome-ot.'}</p><p>💡 Tipp: iPhone-on a Beállítások → Kisegítő lehetőségek → Felolvasott tartalom → Hangok részen tölthető le magyar hang, ha szükséges.</p></section>`;$('closeParent').onclick=()=>{t.hidden=true;t.innerHTML='';$('parentOpen').focus()};t.onclick=e=>{if(e.target===t)$('closeParent').click()};$('soundSetting').onchange=e=>{progress.sound=e.target.checked;save();updateTop()};$('voiceSelect').onchange=e=>{progress.voiceURI=e.target.value;save()};$('testVoice').onclick=()=>speak('Szia! Rudi vagyok. Játsszunk együtt a KalandSzigeten!',true);$('resetProgress').onclick=()=>{if(confirm('Biztosan törlöd az összes csillagot és a haladást?')){progress=defaults();save();updateTop();renderParents();if(current===null)menu()}}}
 $('homeLogo').onclick=menu;$('parentOpen').onclick=renderParents;if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})} $('soundToggle').onclick=()=>{progress.sound=!progress.sound;save();updateTop();showToast(progress.sound?'🔊 Hang bekapcsolva':'🔇 Hang kikapcsolva');if(progress.sound)speak('A hang bekapcsolva!')};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('parentModal').hidden){$('parentModal').hidden=true;$('parentModal').innerHTML=''}});updateTop();menu();
 // Used by the optional beta smoke-test runner, not needed for gameplay.
 window.__kalandBeta={getProgress:()=>structuredClone(progress),getQuestion:()=>question,goHome:menu};
 })();
