/* Original POP MAGIC idol concert theme, child-friendly and readable */
:root{--ink:#2c1b4e;--muted:#76618d;--pink:#ff6ac2;--violet:#a85bed;--mint:#67e8dd;--shadow:0 9px 0 #d7b3ec75,0 25px 50px #45256733}
body{background:linear-gradient(180deg,#1b1043 0,#422073 340px,#f8ebff 680px,#fff8fc 100%);color:var(--ink)}
#app:before{background:radial-gradient(ellipse at 10% 15%,#ed60ce55,transparent 53%),radial-gradient(ellipse at 95% 22%,#36f4f044,transparent 52%);height:480px}
.sky{opacity:.20}.cloud{background:#f0c0ff!important}.cloud:before,.cloud:after{background:#eed0ff!important}
.topbar{padding:9px 15px;border-radius:22px;background:#fff9;backdrop-filter:blur(10px);border:1px solid #f5ddff}
.logo-mark{background:linear-gradient(130deg,#7536ce,#f348b0);box-shadow:0 4px 0 #541c9c}
.beta{background:linear-gradient(90deg,#fa5ca9,#884eed);color:white;letter-spacing:.5px}
.hero{background:radial-gradient(ellipse at 75% 15%,#b35aff50,transparent 58%),linear-gradient(120deg,#28114f,#58308c 59%,#24115d);border:2px solid #ca8cf1;box-shadow:0 12px 0 #211040,0 24px 60px #24125166;min-height:355px;padding:24px 28px}
.hero:after{background:#9e3af3;opacity:.20}.hero h1{color:#fff;text-shadow:0 3px 0 #34175b;font-size:clamp(35px,5.8vw,63px)}
.hero h1 span{color:#fff6a4;text-shadow:0 0 12px #f478b9}
.hero p{color:#f6dcff}.hero .eyebrow{background:#ff69b428;border:1px solid #ef8cdd;color:#fff9ac}
.hero .journey-start{background:linear-gradient(110deg,#ff5daf,#ffb2df);color:#461848;box-shadow:0 8px 0 #9d296e;min-height:70px!important;font-size:clamp(17px,3vw,26px)!important;padding:15px 18px!important}
.hero .journey-resume{color:#dafff8!important;font-size:13px!important}
.hero-art{min-height:275px;isolation:isolate}.hero-art .halo{background:radial-gradient(circle,#a85dfd87,#712fb647 60%,transparent 70%);width:95%}
.idol-stage{display:block;position:relative;z-index:2;max-width:385px;width:100%;filter:drop-shadow(0 12px 12px #15082c80);animation:stage-bob 4s ease-in-out infinite}
@keyframes stage-bob{50%{transform:translateY(-8px)}}
.hero .speech-bubble{top:0;right:0;font-size:13px;color:#712d8b;border:2px solid #ff95de;background:#fff5fe}
.side-games{background:#fceeff;border:2px solid #efd6fc}.side-games>summary{color:#6f2e93}
.game-card{border:2px solid #fff;box-shadow:0 7px 0 #d9bdec,0 14px 36px #49237a22}
.card-count{background:#ffe1f3}.card-math{background:#e9dcff}.card-letters{background:#d5fbf9}.card-words{background:#fff0d8}.card-treasure{background:#e6dcff}.card-stickers{background:#e2fff9}
.progress{background:#e3daef}.progress>div{background:linear-gradient(90deg,#ff60bf,#ae62f4,#5ee6db)}
.play-panel{background:linear-gradient(155deg,#fff8ff,white 72%);border:2px solid #efd7fc;box-shadow:0 9px 0 #d9bbed,0 20px 45px #56308823}
.play-panel:before{background:#fbeaff}
.task-label{background:#f4e5fd;color:#7939a8}
.audio-button{background:linear-gradient(110deg,#6f35ce,#ae68fa);box-shadow:0 6px 0 #4c24a0}
.primary{background:linear-gradient(105deg,#ffd38c,#ff9ed2);box-shadow:0 6px 0 #c67ba9}

\"3\" fill=\"none\"/>\n<circle cx=\"0\" cy=\"96\" r=\"11\" fill=\"#e7b8ff\" stroke=\"#fff\" stroke-width=\"3\"/></g>\n</svg>";
 function menu(){clearTimeout(pendingTimer);pendingTimer=null;stopSpeech();current=null;updateTop();$('screen').innerHTML=`<section class="hero"><div><span class="eyebrow">🎤 POP MAGIC · TANULJ A SZÍNPADON!</span><h1>Készen állsz<br/><span>a show-ra?</span></h1><p>Szia! Rudi vagyok. Segíts a sztárcsapatnak! Betűk, matek, logika és csillagok várnak rád!</p><button id="startFirst" class="primary journey-start" aria-label="Kaland indítása">▶ START · INDUL A SHOW!</button><p class="journey-resume">🎵 ${progress.journey.sessions+1}. fellépés · ${MATH_LEVEL_NAMES[progress.mathPath.level]} · ${progress.journey.introduced.length} betű ${progress.journey.step?'· Folytassuk!':''}</p></div><div class="hero-art"><div class="halo"></div><span class="hero-star">⭐</span>${popStage}<div class="speech-bubble">Rudi DJ! 🦊🎵</div></div></section><details class="side-games"><summary>🎲 Külön játékok és jutalmak</summary><div class="section-top"><div><h2>Válassz egy kalandot! 🗺️</h2><p>Koppints egy színes szigetre!</p></div></div><section class="game-grid">${Object.entries(GAMES).filter(([id])=>id!=='journey').map(([id,g])=>card(id,g)).join('')}<button class="game-card card-stickers" id="stickersOpen" aria-label="Matricaalbum megnyitása"><span class="card-arrow" aria-hidden="true">➜</span><span class="card-icon" aria-hidden="true">🎁</span><span><span class="card-title">Matricaalbum</span><span class="card-desc" style="display:block">Nézd meg a jutalmaid!</span><span class="card-progress" style="display:inline-block">${STICKERS.filter(s=>progress.stars>=s.at).length} / ${STICKERS.length} matrica</span></span></button></section></details><p class="bottom-tip">🔊 Érintsd meg a hangszórót! Rudi mindent elmond magyarul.</p>`;document.querySelectorAll('[data-start]').forEach(x=>x.addEventListener('click',()=>start(x.dataset.start)));$('startFirst').onclick=()=>start('journey');$('stickersOpen').onclick=stickers}
 function start(id){clearTimeout(pendingTimer);stopSpeech();current=id;answerState='none';lastWord=null;lastLetter=null;if(id==='journey'){if(progress.journey.version!==3||!Array.isArray(progress.journey.plan)||!progress.journey.plan.length||progress.journey.step>=progress.journey.plan.length){progress.journey.plan=makeJourneyPlan();progress.journey.step=0;progress.journey.version=3;save()}round=progress.journey.step}else round=0;nextQuestion(true)}

 const MATH_LEVEL_NAMES=["Összeadás 5-ig","Kivonás 5-ig","Összeadás 10-ig","Kivonás 10-ig","Hiányzó szám 10-ig","Összeadás 20-ig (tízesátlépés nélkül)","Kivonás 20-ig (tízesátlépés nélkül)","Összeadás 20-ig (tízesátlépéssel)","Kivonás 20-ig (tízesátlépéssel)","Hiányzó szám 20-ig"];
 const LETTER_ORDER=['A','M','I','L','Ó','E','O','T','F','Á','K','N','S','P','H','R','U','Ú','Ö','Ő','É','Í','Ü','Ű'];
 function eligibleJourneyWords(known=progress.journey.introduced){
   return WORDS.filter(w=>[...w[0]].every(ch=>known.includes(ch)));
 }
 function knownLetter(ch){return progress.journey.introduced.includes(ch)}
 function letterMastered(ch){
   const stats=progress.letterScores[ch];
   if(!stats||!Array.isArray(stats.recent)||stats.recent.length<4)return false;
   return stats.recent.slice(-4).filter(Boolean).length>=3;
 }
 function nextTeachingLetter(){
   const needing=progress.journey.introduced.find(ch=>!letterMastered(ch));
   return needing||LETTER_ORDER.find(ch=>!knownLetter(ch))||choose(LETTER_ORDER);
 }
 function makeJourneyPlan(){
   const target=nextTeachingLetter();
   const known=progress.journey.introduced.filter(ch=>ch!==target);
   const review=known.length?choose(known):target;
   const useNew=!knownLetter(target);
   return [
    {kind:useNew?'letterLesson':'letters',char:target,showModel:true},
    {kind:'letters',char:target,showModel:true},
    {kind:'math'},
    {kind:'pattern'},
    {kind:'letters',char:target,showModel:false},
    {kind:'math'},
    {kind:'logic'},
    {kind:'letters',char:review,showModel:review===target},
    {kind:'math'},
    {kind:'memory'},
    {kind:'math'},
    {kind:'letters',char:target,showModel:false}
   ];
 }
 function recordLetterAnswer(ch,correctFirstTry){
   const stats=progress.letterScores[ch]||{attempts:0,firstTry:0,recent:[]};
   stats.attempts++;
   if(correctFirstTry)stats.firstTry++;
   stats.recent=[...stats.recent,correctFirstTry].slice(-6);
   progress.letterScores[ch]=stats;
 }
 function recordMathAnswer(correctFirstTry){
   const state=progress.mathPath;
   state.total++;
   if(correctFirstTry)state.correct++;
   state.history=[...state.history,correctFirstTry].slice(-8);
   if(state.history.length>=8&&state.history.filter(Boolean).length>=6&&state.level<MATH_LEVEL_NAMES.length-1){

 function renderParents(){const t=$('parentModal');const hadFocus=document.activeElement;t.hidden=false;const support='speechSynthesis' in window;const options=getVoices();const voiceOptions=options.length?options.map(v=>`<option value="${v.voiceURI.replaceAll('"','&quot;')}" ${v.voiceURI===progress.voiceURI?'selected':''}>${v.name.replaceAll('<','&lt;')} (${v.lang})</option>`).join(''):'<option value="">⚠️ Nincs magyar hang telepítve</option>';t.innerHTML=`<section class="parent-box" role="dialog" aria-modal="true" aria-label="Szülői beállítások"><div style="display:flex;justify-content:space-between;align-items:center"><h2>👨‍👩‍👧 Szülőknek</h2><button class="icon-btn" id="closeParent" aria-label="Bezárás">✕</button></div><p>📚 Matek: ${MATH_LEVEL_NAMES[progress.mathPath.level]}. Új szinthez legalább 8 példa, közülük 6 elsőre jó megoldás kell. A betűket sokszor ismételjük, és csak az ismert betűkből alkotunk szavakat.</p><p>A játék az eszköz magyar beszédhangját használja. A 🔊 gombbal bármikor megismételhető egy feladat. Az adatokat csak ezen a készüléken tároljuk.</p><div class="stat-list"><div class="stat"><b>${progress.stars}</b>Csillag</div><div class="stat"><b>${Object.values(progress.solved).reduce((a,b)=>a+b,0)}</b>Feladat</div><div class="stat"><b>${Object.values(progress.completed).reduce((a,b)=>a+b,0)}</b>Kaland</div><div class="stat"><b>${progress.journey.introduced.length}</b>Tanult betű</div><div class="stat"><b>${progress.mathPath.level+1}/${MATH_LEVEL_NAMES.length}</b>Matek szint</div></div><div class="setting-row"><label for="soundSetting">🔊 Hang bekapcsolva</label><input type="checkbox" id="soundSetting" ${progress.sound?'checked':''} style="width:24px;height:24px" /></div><div class="setting-row"><label for="voiceSelect">🇭🇺 Magyar hang</label><select id="voiceSelect">${voiceOptions}</select></div><div class="setting-row"><label for="voiceRate">🗣 Beszéd tempója</label><select id="voiceRate"><option value="0.88" ${(progress.voiceRate||.96)===.88?"sele  $('homeLogo').onclick=menu;$('parentOpen').onclick=renderParents;if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})} $('soundToggle').onclick=()=>{progress.sound=!progress.sound;save();updateTop();showToast(progress.sound?'🔊 Hang bekapcsolva':'🔇 Hang kikapcsolva');if(progress.sound)speak('A hang bekapcsolva!')};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('parentModal').hidden){$('parentModal').hidden=true;$('parentModal').innerHTML=''}});updateTop();menu();if(IS_DEMO){const ribbon=document.createElement('div');ribbon.className='test-mode-ribbon';ribbon.innerHTML='🧪 PRÓBAMÓD — A gyermek előrehaladását nem módosítja. <button id="leaveDemo">Kilépés</button>';const screen=$('screen');screen.parentNode.insertBefore(ribbon,screen);$('leaveDemo').onclick=()=>location.href=location.pathname;}
 // Used by the optional beta smoke-test runner, not needed for gameplay.
 window.__kalandBeta={getProgress:()=>structuredClone(progress),getQuestion:()=>question,goHome:menu};
 })();
 </script>
